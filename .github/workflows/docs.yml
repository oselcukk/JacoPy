name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Build the site with warnings as errors and run every Python example #
  # in docs/ against the current source tree.                           #
  # ------------------------------------------------------------------ #
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install the package and the documentation requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r docs/requirements.txt
      - name: Build the HTML site (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Run the documentation examples
        run: python docs/check_examples.py
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # ------------------------------------------------------------------ #
  # Deploy to GitHub Pages from main only.                              #
  # ------------------------------------------------------------------ #
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
