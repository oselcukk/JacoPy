name: Bug report
description: Report a crash, a wrong result, or an identity that closes or fails unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please search the existing issues first.
        For questions about using JacoPy, start a discussion instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal example
      description: A short, self-contained Python script that reproduces the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output or traceback, and for proofs the output of `jacopy.print_chain(chain)`.
      render: text
  - type: textarea
    id: reference
    attributes:
      label: Mathematical reference
      description: For a mathematical problem, the identity you expected and the source (paper, section, equation) you compare with.
  - type: input
    id: jacopy-version
    attributes:
      label: JacoPy version
      description: Output of `python -c "import jacopy; print(jacopy.__version__)"`, and the commit if installed from source.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12, macOS 15
    validations:
      required: true
