[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jacopy"
# Single version source: jacopy/__init__.py (__version__), read below.
dynamic = ["version"]
description = "Graded algebra, bracket calculus, and metric-affine / generalized geometry with step-by-step proofs (v3, central-code architecture)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary, Source-Available, Personal Use Only" }
authors = [{ name = "Oğuzhan Selçuk" }]
keywords = [
    "graded algebra",
    "lie algebroid",
    "courant algebroid",
    "generalized geometry",
    "metric-affine geometry",
    "poisson geometry",
    "cartan calculus",
    "symbolic computation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
]
dependencies = []

[project.optional-dependencies]
# Coloured terminal display (jacopy.display.terminal; plain text without it).
rich = ["rich>=13.0"]
# The model oracle (jacopy.oracle; pytest --oracle=warn|strict).
oracle = ["sympy>=1.12"]
test = ["pytest>=7.0"]
# Jupyter kernel for the example notebooks (make kernel).
docs = ["ipykernel>=6.0"]
dev = [
    "pytest>=7.0",
    "rich>=13.0",
    "sympy>=1.12",
    "ipykernel>=6.0",
]

[project.urls]
Repository = "https://github.com/oselcukk/JacoPy.v.3"
Changelog = "https://github.com/oselcukk/JacoPy.v.3/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "jacopy.__version__" }

[tool.setuptools.package-data]
jacopy = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jacopy*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
